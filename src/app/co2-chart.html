<section aria-labelledby="history-title">
  <h2 id="history-title">CO₂-Verlauf</h2>
  <p class="caption">Letzte {{ history.measurements().length }} von maximal 60 Messungen</p>
  @if (chart(); as data) {
    <svg viewBox="0 0 340 190" role="img" aria-labelledby="chart-title chart-description">
      <title id="chart-title">Simulierter CO₂-Verlauf in ppm</title>
      <desc id="chart-description">{{ data.points.length }} Messungen von {{ data.first }} bis {{ data.last }}. Unterbrechungen der Simulation werden nicht verbunden.</desc>
      <text x="48" y="16">ppm</text>
      <text x="40" y="32" text-anchor="end">{{ data.max }}</text>
      <text x="40" y="152" text-anchor="end">{{ data.min }}</text>
      <path class="axis" d="M48 28 V148 H320" />
      @for (segment of data.segments; track $index) {
        <polyline class="line" [attr.points]="segment" />
      }
      @for (point of data.points; track $index) {
        <circle [attr.cx]="point.x" [attr.cy]="point.y" r="3"><title>{{ point.label }}</title></circle>
      }
      <text x="48" y="174">{{ data.first }}</text>
      @if (data.points.length > 1) { <text x="320" y="174" text-anchor="end">{{ data.last }}</text> }
    </svg>
    <p class="caption">Zeit · Pausen erscheinen als Lücken</p>
  } @else {
    <p class="empty">Noch keine Messungen. Starte die Simulation, um den Verlauf zu sehen.</p>
  }
</section>
