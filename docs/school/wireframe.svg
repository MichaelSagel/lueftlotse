<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1160" viewBox="0 0 900 1160" role="img" aria-labelledby="title description">
  <title id="title">Gemeinsamer UI-Wireframe: Browser und Android</title>
  <desc id="description">CO2, Sensorverbindung und Serververlauf untereinander. Inhalt auf grossen Bildschirmen zentriert, maximal 440 CSS-Pixel breit. Verbindungstaste immer sichtbar; Serverfilter und Ergebnisse immer sichtbar; Tabellenzeilen sind Platzhalter.</desc>
  <rect width="900" height="1160" fill="white"/>
  <g fill="none" stroke="black" stroke-width="2">
    <rect x="290" y="65" width="320" height="980"/>
    <rect x="310" y="155" width="280" height="185" rx="12"/>
    <rect x="320" y="460" width="260" height="42" rx="6"/>
    <rect x="310" y="700" width="280" height="325" rx="8"/>
    <rect x="320" y="745" width="260" height="40"/>
    <rect x="320" y="800" width="260" height="40"/>
    <rect x="320" y="850" width="260" height="40" rx="6"/>
    <rect x="320" y="920" width="260" height="45"/>
    <path d="M450 920V965"/>
    <rect x="320" y="980" width="260" height="35" rx="6"/>
  </g>
  <g fill="black" font-family="Arial, sans-serif" font-size="16">
    <text x="450" y="35" text-anchor="middle" font-weight="bold">Browser und Android: eine Spalte</text>
    <text x="310" y="95" font-size="13">RAUMLUFT IM BLICK</text>
    <text x="310" y="135" font-size="26" font-weight="bold">Lüftlotse</text>
    <text x="450" y="190" text-anchor="middle">CO₂-Konzentration</text>
    <text x="450" y="250" text-anchor="middle" font-size="44">—</text>
    <text x="450" y="280" text-anchor="middle">ppm</text>
    <text x="450" y="310" text-anchor="middle">Sensor nicht verfügbar</text>
    <text x="450" y="330" text-anchor="middle" font-size="11">Sensor nicht verfügbar · Kein Gerät verbunden.</text>
    <text x="450" y="487" text-anchor="middle">Sensor auswählen</text>
    <text x="330" y="770" font-size="13">Von: Datum / Uhrzeit</text>
    <text x="330" y="825" font-size="13">Bis: Datum / Uhrzeit</text>
    <text x="450" y="877" text-anchor="middle">Verlauf anzeigen</text>
    <text x="385" y="947" text-anchor="middle" font-size="13">Zeit ↓ / …</text><text x="515" y="947" text-anchor="middle" font-size="13">CO₂ (ppm) / …</text>
    <text x="450" y="1004" text-anchor="middle">Weitere laden</text>
    <text x="450" y="1080" text-anchor="middle" font-size="13">Maximal 440 CSS-Pixel breit, zentriert; Reihenfolge und Abstaende bleiben gleich.</text>
    <text x="450" y="1105" text-anchor="middle" font-size="13">Verbindungstaste: Sensor auswaehlen oder Trennen. Weitere laden nur bei nextCursor.</text>
    <text x="450" y="1130" text-anchor="middle" font-size="13">Tabellenzeilen sind Platzhalter. MeasuredAt = Empfang im Browser.</text>
  </g>
</svg>
