<main
  class="dashboard"
  (touchstart)="startPull($event)"
  (touchmove)="movePull($event)"
  (touchend)="finishPull($event)"
  (touchcancel)="cancelPull()"
>
  <header>
    <p class="eyebrow">RAUMLUFT IM BLICK</p>
    <h1>Lüftlotse</h1>
  </header>
  <div class="dashboard-columns">
    <div class="sensor-column">
      @if (android) {
        <div
          class="pull-indicator"
          [class.visible]="pullVisible()"
          [style.height.px]="pullHeight()"
          aria-hidden="true"
        >
          <span
            class="pull-ring"
            [class.spinning]="pullSpinning()"
          ></span>
        </div>
      }
      <section
        [class]="'reading ' + status().color"
        aria-labelledby="co2-label"
      >
        <h2 id="co2-label">CO₂-Konzentration</h2>
        <p class="measurement">
          <strong>{{ source.current()?.ppm ?? '—' }}</strong>
          <span>ppm</span>
        </p>
        <p class="status">
          <span
            class="dot"
            aria-hidden="true"
          ></span>{{ status().label }}</p>
        <p class="hint">{{ searching() ? 'Sensor wird gesucht …' : status().hint }}</p>
      </section>
    </div>
    <div class="history-column">
      <app-device-discovery />
      <app-server-history />
    </div>
  </div>
</main>
